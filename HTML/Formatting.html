<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Vũ Văn Cường</h2>
    <p>2221050692</p>

    <p>This is an <strong>important</strong> message.</p>   <!-- thẻ strong: chữ in đậm -->
    <p>Please read <em>carefully.</em></p>          <!-- thẻ em: chữ nghiêng -->
    <p>Do not forget to buy <mark>milk</mark> today.</p>      <!--thẻ mark: tô nổi bật (highlight) nội dung (mặc định là nền màu vàng) -->
    <p>The chemical formula for water is: H<sub>2</sub>O</p>     <!-- thẻ sub: hiển thị chữ ở dạng chỉ số dưới (subcript) -->
    <p>My favorite color is <del>blue</del> red.</p>    <!-- thẻ del: đánh dấu nội dung đã bị xóa -->
</body>
</html>
